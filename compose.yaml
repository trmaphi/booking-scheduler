name: scheduler-go-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - scheduler-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: ["go", "run", "./cmd/migrate"]
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/scheduler
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: ["air", "-c", ".air.toml"]
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/scheduler
      ALLOWED_ORIGIN: http://localhost:${WEB_PORT:-3000}
      LISTEN_ADDRESS: :8080
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/api/v1/health/ready",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s
    volumes:
      - ./api:/app
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build

  web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    command:
      - sh
      - -ec
      - CI=true pnpm install --frozen-lockfile && exec pnpm dev --webpack --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8080}
      API_INTERNAL_BASE_URL: http://api:8080
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "1000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 120s
    volumes:
      - ./:/app
      - web-modules:/app/node_modules
      - web-next:/app/.next

volumes:
  scheduler-postgres:
  go-modules:
  go-build:
  web-modules:
  web-next:
