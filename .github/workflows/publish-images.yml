name: Publish and deploy production images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected commit after publishing
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install infrastructure verification tools
        run: |
          python3 -m venv "$RUNNER_TEMP/infrastructure-venv"
          "$RUNNER_TEMP/infrastructure-venv/bin/pip" install ansible-core ansible-lint
          echo "$RUNNER_TEMP/infrastructure-venv/bin" >> "$GITHUB_PATH"
      - name: Install infrastructure verification collections
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml
      - name: Verify production infrastructure
        run: pnpm verify:infrastructure
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/booking-scheduler-web:${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
            APP_ORIGIN=https://booking-scheduler.trmaphi.work
      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/booking-scheduler-api:${{ github.sha }}
          build-args: REVISION=${{ github.sha }}

  migrate:
    if: github.ref == 'refs/heads/main' || inputs.deploy == true
    needs: verify-and-publish
    uses: ./.github/workflows/migrate-production.yml
    with:
      release_tag: ${{ github.sha }}
    secrets: inherit

  deploy:
    if: github.ref == 'refs/heads/main' || inputs.deploy == true
    needs: migrate
    uses: ./.github/workflows/deploy-production.yml
    with:
      release_tag: ${{ github.sha }}
    secrets: inherit
