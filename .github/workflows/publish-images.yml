name: Publish and deploy production images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "openspec/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected commit after publishing
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache infrastructure verification collections
        id: verification-collections-cache
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('infra/ansible/requirements.yml') }}
      - name: Install infrastructure verification tools
        run: |
          python3 -m venv "$RUNNER_TEMP/infrastructure-venv"
          "$RUNNER_TEMP/infrastructure-venv/bin/pip" install ansible-core ansible-lint
          npm install --global @fission-ai/openspec@1.13.1
          echo "$RUNNER_TEMP/infrastructure-venv/bin" >> "$GITHUB_PATH"
      - name: Install infrastructure verification collections
        if: steps.verification-collections-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml
      - name: Verify production infrastructure
        run: pnpm verify:infrastructure

  build-images:
    needs: verify-infrastructure
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: Dockerfile.web
            image: booking-scheduler-web
            build-args: |
              REVISION=${{ github.sha }}
              APP_ORIGIN=https://booking-scheduler.trmaphi.work
          - name: api
            context: api
            file: api/Dockerfile
            image: booking-scheduler-api
            build-args: REVISION=${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    if: github.ref == 'refs/heads/main' || inputs.deploy == true
    needs: build-images
    runs-on: ubuntu-24.04
    environment: Production
    steps:
      - uses: actions/checkout@v5
      - name: Validate immutable release tag
        env:
          RELEASE_TAG: ${{ github.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release tag must be a full lowercase Git commit SHA"
            exit 1
          fi
      - name: Install Ansible
        run: pipx install ansible-core
      - name: Cache required collections
        id: release-collections-cache
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('infra/ansible/requirements.yml') }}
      - name: Install required collections
        if: steps.release-collections-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml
      - name: Prepare ephemeral release credentials
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          PRODUCTION_VARS_YAML: ${{ secrets.PRODUCTION_VARS_YAML }}
          PRODUCTION_VAULT_YAML: ${{ secrets.PRODUCTION_VAULT_YAML }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for required in VPS_SSH_PRIVATE_KEY PRODUCTION_VARS_YAML PRODUCTION_VAULT_YAML ANSIBLE_VAULT_PASSWORD GHCR_DEPLOY_TOKEN; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is required for production release"
              exit 1
            fi
          done
          install -m 700 -d "$RUNNER_TEMP/deploy"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy/id_ed25519"
          printf '%s' "$PRODUCTION_VARS_YAML" > "$RUNNER_TEMP/deploy/production.yml"
          printf '%s' "$PRODUCTION_VAULT_YAML" > "$RUNNER_TEMP/deploy/production.vault.yml"
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/deploy/vault-password"
          jq -n --arg username "$GITHUB_ACTOR" --arg token "$GHCR_DEPLOY_TOKEN" \
            '{application_ghcr_username:$username,application_ghcr_token:$token}' \
            > "$RUNNER_TEMP/deploy/ghcr.json"
          chmod 600 "$RUNNER_TEMP/deploy/"*
          ssh-keyscan -H 103.188.83.18 > "$RUNNER_TEMP/deploy/known_hosts"
      - name: Migrate and deploy published commit on VPS
        env:
          ANSIBLE_CONFIG: infra/ansible/ansible.cfg
          ANSIBLE_HOST_KEY_CHECKING: "true"
          ANSIBLE_SSH_COMMON_ARGS: "-o UserKnownHostsFile=${{ runner.temp }}/deploy/known_hosts"
          RELEASE_TAG: ${{ github.sha }}
        run: >-
          ansible-playbook -i infra/ansible/inventory/production.yml
          infra/ansible/playbooks/release.yml
          --private-key "$RUNNER_TEMP/deploy/id_ed25519"
          --vault-password-file "$RUNNER_TEMP/deploy/vault-password"
          --extra-vars @"$RUNNER_TEMP/deploy/production.yml"
          --extra-vars @"$RUNNER_TEMP/deploy/production.vault.yml"
          --extra-vars @"$RUNNER_TEMP/deploy/ghcr.json"
          --skip-tags backup
          --extra-vars "release_tag=$RELEASE_TAG"
