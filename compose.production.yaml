name: booking-scheduler-prod

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *bounded-logging
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 2G }

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    healthcheck:
      test: ["CMD", "/usr/local/bin/migrate", "--help"]
      interval: 30s
      timeout: 5s
      retries: 1
    restart: "no"
    logging: *bounded-logging

  api:
    image: ${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ALLOWED_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN is required}
      LISTEN_ADDRESS: :8080
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data, app]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/api/v1/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *bounded-logging
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1G }

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    depends_on:
      api: { condition: service_healthy }
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *bounded-logging
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }

  proxy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [app]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *bounded-logging
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

networks:
  app:
  data:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
